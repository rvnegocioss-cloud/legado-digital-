<!DOCTYPE html>
<html>
<head>
<title>teste hero</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>

<!-- @template name="Hero da Landing" description="Hero da landing institucional: arco se abrindo tipo cinema, foto da família rumo ao portal, retratos nos galhos, fio conectando a constelação no céu, faixa de stats." -->
<helmet><style>
@keyframes ld-pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes ld-flame{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ld-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes ld-star{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}
@keyframes ld-threadglow{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes ld-leaf{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:translateY(0) scale(1)}}
.arco-batente{backface-visibility:hidden;transform-origin:100px 300px;transition:transform 2.1s cubic-bezier(.32,.72,.18,1),opacity 1.5s ease .9s}
.arco-esq{transform:rotateY(0deg) translateZ(0)}
.arco-dir{transform:rotateY(0deg) translateZ(0)}
.decor-abre .arco-esq{transform:rotateY(-78deg) translateZ(-30px);opacity:.22}
.decor-abre .arco-dir{transform:rotateY(78deg) translateZ(-30px);opacity:.22}
body{margin:0}
</style></helmet>
<section style="position:relative;display:grid;grid-template-columns:1.02fr 1fr;min-height:900px;background:#F5F2EB;font-family:Georgia,'Times New Roman',serif;overflow:hidden">
<div style="position:relative;display:flex;flex-direction:column;justify-content:center;gap:30px;padding:110px 76px 170px 84px;z-index:2">

<div class="decor-abre" style="position:absolute;left:-52px;top:50%;transform:translateY(-50%);width:200px;height:780px;perspective:1400px;transform-style:preserve-3d;opacity:.16;pointer-events:none">
<svg viewBox="0 0 200 300" style="position:absolute;inset:0;width:100%;height:260px" fill="none">
<defs><linearGradient id="ouroClaro2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF3D6"/><stop offset="45%" stop-color="#E8C989"/><stop offset="100%" stop-color="#C9A46A"/></linearGradient></defs>
<path class="arco-batente arco-esq" d="M20 300V120C20 60 100 10 100 10" stroke="url(#ouroClaro2)" stroke-width="3"></path>
<path class="arco-batente arco-dir" d="M100 10S180 60 180 120v180" stroke="url(#ouroClaro2)" stroke-width="3"></path>
<circle cx="100" cy="36" r="9" fill="#FFF3D6" style="animation:ld-flame 3.4s ease-in-out infinite"></circle>
</svg>
<svg viewBox="0 0 200 120" style="position:absolute;left:0;bottom:0;width:100%;height:120px" fill="none" stroke="url(#ouroClaro2)" stroke-width="2.5">
<path d="M100 0V64"></path>
<path d="M100 30C88 20 76 24 70 34"></path>
<path d="M100 30C112 20 124 24 130 34"></path>
<path d="M100 48C84 40 68 44 58 56"></path>
<path d="M100 48C116 40 132 44 142 56"></path>
</svg>
<div style="position:absolute;left:50%;top:154px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#0B1D2A;border:2px solid #E8C989;animation:ld-leaf .8s 1.9s both"></div>
<div style="position:absolute;left:29%;top:186px;width:18px;height:18px;border-radius:50%;background:#0B1D2A;border:2px solid #E8C989;animation:ld-leaf .8s 2.05s both"></div>
<div style="position:absolute;left:65%;top:186px;width:18px;height:18px;border-radius:50%;background:#0B1D2A;border:2px solid #E8C989;animation:ld-leaf .8s 2.2s both"></div>
<div style="position:absolute;left:16%;top:222px;width:16px;height:16px;border-radius:50%;background:#0B1D2A;border:2px solid #E8C989;animation:ld-leaf .8s 2.35s both"></div>
<div style="position:absolute;left:76%;top:222px;width:16px;height:16px;border-radius:50%;background:#0B1D2A;border:2px solid #E8C989;animation:ld-leaf .8s 2.5s both"></div>
</div>

<p style="margin:0;position:relative;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:#a8834a;animation:ld-rise .8s ease-out both">Memoriais digitais com QR Code</p>
<h1 style="margin:0;position:relative;font-size:72px;line-height:1.03;letter-spacing:-.015em;color:#0B1D2A;text-wrap:pretty;max-width:14ch;animation:ld-rise .9s .08s ease-out both">Toda Família Tem Uma História</h1>
<p style="margin:0;position:relative;font-size:21px;line-height:1.6;color:#58616B;max-width:33em;text-wrap:pretty;animation:ld-rise .9s .16s ease-out both">Um espaço permanente para preservar a história de quem se foi. Sua funerária oferece memoriais digitais com QR Code às famílias que atende.</p>
<div style="position:relative;display:flex;align-items:center;gap:20px;margin-top:6px;animation:ld-rise .9s .24s ease-out both"><a href="#comecar" style="display:inline-flex;align-items:center;padding:19px 40px;background:#E8C989;color:#0B1D2A;font-size:18px;letter-spacing:.03em;text-decoration:none;border-radius:2px;box-shadow:0 10px 30px -14px rgba(168,131,74,.85)" style-hover="background:#FFF3D6">Começar Agora</a><span style="font-size:15px;color:#58616B">ou busque um memorial existente</span></div>
<form action="#buscar" style="position:relative;display:flex;align-items:stretch;max-width:560px;border:1px solid #d8d0be;background:#fffdf8;border-radius:2px;animation:ld-rise .9s .32s ease-out both"><input type="search" placeholder="Buscar um memorial pelo nome…" style="flex:1;min-width:0;padding:18px 20px;border:0;background:transparent;font-family:Georgia,serif;font-size:17px;color:#0B1D2A;outline:none"><button type="submit" style="padding:0 28px;border:0;border-left:1px solid #e6dfcf;background:transparent;font-family:Georgia,serif;font-size:16px;letter-spacing:.04em;color:#a8834a;cursor:pointer" style-hover="color:#0B1D2A">Buscar</button></form>
</div>
<div style="position:relative;overflow:hidden">
<img src="img/hero-familia-portal.jpg" alt="Família subindo uma escada de pedra em direção a um portal em arco gótico duplo, sob luz dourada de fim de tarde" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 42%">
<svg viewBox="0 0 700 900" preserveAspectRatio="xMidYMin slice" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" fill="none">
<path d="M60 220 L120 96 L228 150 L360 70 L480 168 L588 108 L650 220" stroke="#F5F2EB" stroke-width="1" style="animation:ld-threadglow 7s ease-in-out infinite"></path>
<g fill="#F5F2EB"><circle cx="120" cy="96" r="2.6" style="transform-origin:120px 96px;animation:ld-star 4.6s ease-in-out infinite"></circle><circle cx="228" cy="150" r="2" style="transform-origin:228px 150px;animation:ld-star 5.4s .4s ease-in-out infinite"></circle><circle cx="360" cy="70" r="3.2" style="transform-origin:360px 70px;animation:ld-star 6.1s .9s ease-in-out infinite"></circle><circle cx="480" cy="168" r="2.2" style="transform-origin:480px 168px;animation:ld-star 5s 1.4s ease-in-out infinite"></circle><circle cx="588" cy="108" r="2.8" style="transform-origin:588px 108px;animation:ld-star 4.2s 1.9s ease-in-out infinite"></circle><circle cx="650" cy="220" r="1.8" style="transform-origin:650px 220px;animation:ld-star 5.7s 2.3s ease-in-out infinite"></circle><circle cx="60" cy="220" r="1.8" style="transform-origin:60px 220px;animation:ld-star 6.4s .2s ease-in-out infinite"></circle></g>
</svg>
<div style="position:absolute;left:52%;top:45%;width:42%;padding-bottom:42%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,243,214,.75) 0%,rgba(232,201,137,.34) 42%,rgba(232,201,137,0) 72%);mix-blend-mode:screen;animation:ld-pulse 5.2s ease-in-out infinite;pointer-events:none"></div>
<div style="position:absolute;inset:0;background:linear-gradient(90deg,#F5F2EB 0%,rgba(245,242,235,.9) 12%,rgba(245,242,235,0) 44%);pointer-events:none"></div>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,242,235,.5) 0%,rgba(245,242,235,0) 24%,rgba(11,29,42,.12) 100%);pointer-events:none"></div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;padding:0 84px;background:linear-gradient(90deg,rgba(245,242,235,.98) 0%,rgba(245,242,235,.93) 60%,rgba(245,242,235,.7) 100%);backdrop-filter:blur(6px);border-top:1px solid #e4dbc7"><div style="display:flex;flex-direction:column;gap:6px;padding:30px 56px 30px 0"><span style="font-size:34px;color:#0B1D2A">4</span><span style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#58616B">Níveis de acesso</span></div><div style="width:1px;height:52px;background:#e4dbc7"></div><div style="display:flex;flex-direction:column;gap:6px;padding:30px 56px"><span style="font-size:34px;color:#0B1D2A">100%</span><span style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#58616B">Online</span></div><div style="width:1px;height:52px;background:#e4dbc7"></div><div style="display:flex;flex-direction:column;gap:6px;padding:30px 56px"><span style="font-size:34px;color:#0B1D2A">100%</span><span style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#58616B">Privacidade total</span></div></div>
</section>


</body>
</html>
