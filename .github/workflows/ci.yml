name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O build só precisa que as variáveis EXISTAM (os clientes do Supabase
      # são criados na importação dos módulos). Os valores abaixo são falsos
      # de propósito: o CI não fala com o banco real e nenhuma chave de
      # verdade fica guardada no GitHub. As páginas que buscam dado no build
      # já tratam a falha da consulta e saem vazias.
      - name: Run Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-publica-de-ci
          SUPABASE_SERVICE_ROLE_KEY: chave-de-ci
          SESSION_HMAC_SECRET: segredo-de-ci

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
