<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protótipo: ruas com curva e tipo</title>
<style>
:root{--ink:#e8eef2;--bg:#0b1b26;--pan:#102635;--bord:#27465a;--gold:#c9a24b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 Inter,system-ui,sans-serif;height:100vh;display:flex}
aside{width:280px;background:var(--pan);border-right:1px solid var(--bord);padding:14px;overflow:auto;flex:none}
aside h2{font-size:15px;margin:0 0 8px}
.dica{font-size:12.5px;color:#a9bcc9;margin:0 0 12px}
.grupo{margin:12px 0 4px;font-weight:600;font-size:13px}
.rua{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--bord);border-radius:8px;margin:4px 0;cursor:pointer;background:#0d2230}
.rua.sel{border-color:var(--gold);background:#162f40}
.rua i{display:inline-block;width:26px;height:0}
.p{border-top:6px solid #8a1c1c}.s{border-top:3px dotted #3fae5d}
.btn{font:inherit;color:var(--ink);background:#173446;border:1px solid var(--bord);border-radius:8px;padding:8px 10px;cursor:pointer;width:100%;margin-top:8px}
.btn:hover{border-color:var(--gold)}
main{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block;touch-action:none}
#menu{position:absolute;background:#fff;color:#111;border-radius:10px;box-shadow:0 8px 28px #0008;padding:6px;min-width:190px;display:none;z-index:5;font-size:13.5px}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit;color:#111}
#menu button:hover{background:#eef2f5}
#menu .tit{font-size:11.5px;color:#667;padding:4px 10px}
#menu hr{border:0;border-top:1px solid #e3e8ec;margin:4px 0}
#aviso{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:7px 14px;border-radius:20px;font-size:13px;display:none}
.leg{position:absolute;right:12px;bottom:12px;background:#000a;padding:8px 12px;border-radius:8px;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:8px;margin:3px 0}
</style></head><body>
<aside>
  <h2>Ruas (protótipo)</h2>
  <p class="dica">Bolinha branca: arraste para curvar (duplo clique desfaz). Bandeira na ponta: tipo ou continuar.</p>
  <button class="btn" id="bNova" style="margin:0 0 6px;background:#c9a24b;color:#111;font-weight:600">+ Nova rua</button>
  <div class="grupo" id="gP"></div><div id="lP"></div>
  <div class="grupo" id="gS"></div><div id="lS"></div>
  <button class="btn" id="bConcluir" style="display:none"></button>
  <button class="btn" id="bReset">Recomeçar exemplo</button>
</aside>
<main>
  <svg id="svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="aviso"></div>
  <button id="bFim" style="display:none;position:absolute;right:14px;top:12px;z-index:6;background:#c9a24b;color:#111;border:0;border-radius:10px;padding:10px 16px;font:600 14px Inter,system-ui;cursor:pointer;box-shadow:0 4px 14px #0007">Concluir a rua (Enter)</button>
  <div id="menu"></div>
  <div class="leg"><div><i class="p" style="width:30px;display:inline-block"></i> Principal (asfalto, carro)</div><div><i class="s" style="width:30px;display:inline-block"></i> Rua dos túmulos (a pé)</div></div>
</main>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg'),menu=document.getElementById('menu'),aviso=document.getElementById('aviso');
let ruas,sel=null,mode='idle',ext=null,buf=[],cursor=null;
function reset(){ruas=[
 {id:1,tipo:'principal',pts:[{x:90,y:520},{x:330,y:470},{x:600,y:420,c:{x:470,y:330}},{x:880,y:130}]},
 {id:2,tipo:'secundaria',pts:[{x:330,y:470},{x:350,y:250},{x:340,y:90}]}
];sel=1;mode='idle';ext=null;buf=[];draw();}
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function pathD(r){let d='M'+r.pts[0].x+' '+r.pts[0].y;for(let i=1;i<r.pts.length;i++){const p=r.pts[i];d+=p.c?` Q${p.c.x} ${p.c.y} ${p.x} ${p.y}`:` L${p.x} ${p.y}`}return d}
function mid(r,i){const a=r.pts[i-1],b=r.pts[i];return b.c?{x:.25*a.x+.5*b.c.x+.25*b.x,y:.25*a.y+.5*b.c.y+.25*b.y}:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function fundo(){
 el('rect',{width:1000,height:640,fill:'#1b2a22'});
}
function draw(){
 svg.innerHTML='';fundo();
 ruas.forEach(r=>{
  if(r.pts.length<2)return;
  const d=pathD(r);
  if(r.tipo==='principal'){el('path',{d,fill:'none',stroke:'#fff',opacity:.85,'stroke-width':11,'stroke-linecap':'round','stroke-linejoin':'round'});el('path',{d,fill:'none',stroke:'#8a1c1c','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'})}
  else{el('path',{d,fill:'none',stroke:'#fff',opacity:.8,'stroke-width':5,'stroke-linecap':'round'});el('path',{d,fill:'none',stroke:'#2b7a3d','stroke-width':3,'stroke-dasharray':'1 6','stroke-linecap':'round'})}
  const hit=el('path',{d,fill:'none',stroke:'transparent','stroke-width':22,style:'cursor:pointer'});
  hit.addEventListener('pointerdown',e=>{if(mode!=='idle')return;e.stopPropagation();sel=r.id;fechar();draw();renderPanel()});
 });
 const r=ruas.find(x=>x.id===sel);
 if(r&&r.pts.length>=2&&mode==='idle'){
  for(let i=1;i<r.pts.length;i++){const m=mid(r,i);const h=el('circle',{cx:m.x,cy:m.y,r:8,fill:'#fff',stroke:'#111','stroke-width':2,style:'cursor:grab'});
   h.addEventListener('pointerdown',e=>arrastarBolinha(e,r,i));h.addEventListener('dblclick',()=>{delete r.pts[i].c;draw()});}
  [['start',r.pts[0]],['end',r.pts[r.pts.length-1]]].forEach(([qual,p])=>{
   const g=el('g',{style:'cursor:pointer',transform:`translate(${p.x},${p.y})`});
   el('circle',{r:16,fill:'#0008'},g);el('path',{d:'M-4 8 L-4 -12 L8 -7 L-4 -2',fill:'#ffd34d',stroke:'#fff','stroke-width':1.5,'stroke-linejoin':'round'},g);
   g.addEventListener('pointerdown',e=>{e.stopPropagation();menuPonta(e,r,qual)});});
 }
 if(mode==='ext-click'&&ext&&ext.r.pts.length){const p=ext.r.pts[ext.r.pts.length-1];if(cursor)el('line',{x1:p.x,y1:p.y,x2:cursor.x,y2:cursor.y,stroke:'#fff','stroke-dasharray':'6 5','stroke-width':2});
  const q=ext.r.pts[ext.r.pts.length-1];el('circle',{cx:q.x,cy:q.y,r:7,fill:'#ffd34d'})}
 if(mode==='ext-pencil'&&buf.length>1)el('polyline',{points:buf.map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:'#c9a0ff','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'});
}
function pt(e){const b=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;const sc=Math.max(b.width/vb.width,b.height/vb.height);const ox=(b.width-vb.width*sc)/2,oy=(b.height-vb.height*sc)/2;return{x:(e.clientX-b.left-ox)/sc,y:(e.clientY-b.top-oy)/sc}}
function arrastarBolinha(e,r,i){
 e.stopPropagation();e.preventDefault();fechar();let moveu=false;const a=r.pts[i-1],b=r.pts[i];const x0=e.clientX,y0=e.clientY;
 const mv=ev=>{if(Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)>4)moveu=true;if(!moveu)return;const h=pt(ev);b.c={x:2*h.x-.5*(a.x+b.x),y:2*h.y-.5*(a.y+b.y)};draw()};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(moveu)renderPanel()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function abrir(e,html,fn){menu.innerHTML=html;const b=svg.parentElement.getBoundingClientRect();menu.style.left=Math.min(e.clientX-b.left+10,b.width-210)+'px';menu.style.top=Math.min(e.clientY-b.top+10,b.height-200)+'px';menu.style.display='block';fn(menu)}
function fechar(){menu.style.display='none'}
function menuBolinha(e,r,i){abrir(e,'<div class="tit">Meio do trecho</div><button data-a="puxar">Puxar para curvar (arraste a bolinha)</button><button data-a="reta">Voltar reta</button>',m=>{
 m.querySelector('[data-a=reta]').onclick=()=>{delete r.pts[i].c;fechar();draw()};
 m.querySelector('[data-a=puxar]').onclick=()=>{fechar();say('Arraste a bolinha branca para curvar o trecho.')}})}
function menuPonta(e,r,qual){abrir(e,'<button data-a="p">Rua principal</button><button data-a="s">Rua dos túmulos</button><hr><button data-a="l">Continuar com lápis</button><button data-a="c">Continuar clicando pontos</button>',m=>{
 m.querySelector('[data-a=p]').onclick=()=>{r.tipo='principal';fechar();draw();renderPanel()};
 m.querySelector('[data-a=s]').onclick=()=>{r.tipo='secundaria';fechar();draw();renderPanel()};
 m.querySelector('[data-a=l]').onclick=()=>iniciarExt(r,qual,'ext-pencil');
 m.querySelector('[data-a=c]').onclick=()=>iniciarExt(r,qual,'ext-click')})}
function novaRua(m){fechar();const r={id:Math.max(0,...ruas.map(x=>x.id))+1,tipo:'principal',pts:[]};ruas.push(r);sel=r.id;ext={r,n:0};mode=m;buf=[];
 say(m==='ext-pencil'?'Segure e arraste para desenhar a rua. Solte para gravar.':'Clique para pôr os pontos. Duplo clique ou Enter termina.');bFim.style.display='block';draw();renderPanel()}
document.getElementById('bNova').onclick=e=>abrir(e,'<button data-a="l">Desenhar com lápis</button><button data-a="c">Desenhar clicando pontos</button>',m=>{
 m.querySelector('[data-a=l]').onclick=()=>novaRua('ext-pencil');m.querySelector('[data-a=c]').onclick=()=>novaRua('ext-click')});
function reverter(r){const o=r.pts,n=[];for(let i=o.length-1;i>=0;i--){const p={x:o[i].x,y:o[i].y};if(i<o.length-1&&o[i+1].c)p.c=o[i+1].c;n.push(p)}r.pts=n}
function iniciarExt(r,qual,m){fechar();if(qual==='start')reverter(r);ext={r};mode=m;buf=[];say(m==='ext-pencil'?'Segure e arraste para desenhar. Solte para gravar.':'Clique para pôr pontos. Duplo clique ou Enter termina.');
 document.getElementById('bConcluir').style.display=m==='ext-click'?'block':'none';bFim.style.display='block';draw()}
function terminar(){bFim.style.display='none';if(ext&&ext.r.pts.length<2){ruas=ruas.filter(x=>x!==ext.r);sel=null}mode='idle';ext=null;buf=[];cursor=null;aviso.style.display='none';document.getElementById('bConcluir').style.display='none';draw();renderPanel()}
function say(t){aviso.textContent=t;aviso.style.display='block'}
const bFim=document.getElementById('bFim');bFim.onclick=()=>terminar();
function rdp(p,tol){if(p.length<3)return p;let mx=0,ix=0;const a=p[0],b=p[p.length-1];const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
 for(let i=1;i<p.length-1;i++){const d=Math.abs(dy*p[i].x-dx*p[i].y+b.x*a.y-b.y*a.x)/L;if(d>mx){mx=d;ix=i}}
 if(mx>tol){return rdp(p.slice(0,ix+1),tol).slice(0,-1).concat(rdp(p.slice(ix),tol))}return[a,b]}
svg.addEventListener('pointerdown',e=>{
 fechar();
 if(mode==='ext-pencil'){e.preventDefault();buf=[pt(e)];const mv=ev=>{buf.push(pt(ev));draw()};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
   if(mode!=='ext-pencil')return;if(buf.length>2){const s=rdp(buf,3);const r=ext.r;(r.pts.length?s.slice(1):s).forEach(p=>r.pts.push({x:p.x,y:p.y}))}terminar()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('blur',up,{once:true});return}
 if(mode==='ext-click'){const p=pt(e);if(!ext.r.pts.length){ext.r.pts.push({x:p.x,y:p.y});draw();return}const u=ext.r.pts[ext.r.pts.length-1];if(Math.hypot(p.x-u.x,p.y-u.y)<10&&ext.r.pts.length>1&&ext.n>0){terminar();return}ext.n=(ext.n||0)+1;ext.r.pts.push({x:p.x,y:p.y});draw();return}
 sel=null;draw();renderPanel()});
svg.addEventListener('dblclick',()=>{if(mode==='ext-click'){const r=ext.r,n=r.pts.length;if(n>2&&Math.hypot(r.pts[n-1].x-r.pts[n-2].x,r.pts[n-1].y-r.pts[n-2].y)<6)r.pts.pop();terminar()}});
svg.addEventListener('pointermove',e=>{if(mode==='ext-click'){cursor=pt(e);draw()}});
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter'){fechar();if(mode!=='idle')terminar()}});
document.getElementById('bConcluir').onclick=terminar;
document.getElementById('bReset').onclick=()=>{bFim.style.display='none';reset();renderPanel();aviso.style.display='none';document.getElementById('bConcluir').style.display='none'};
function renderPanel(){
 const P=ruas.filter(r=>r.tipo==='principal'),S=ruas.filter(r=>r.tipo==='secundaria');
 document.getElementById('gP').textContent=P.length+(P.length===1?' rua principal':' ruas principais');
 document.getElementById('gS').textContent=S.length+(S.length===1?' rua dos túmulos':' ruas dos túmulos');
 const li=(r)=>`<div class="rua ${r.id===sel?'sel':''}" data-id="${r.id}"><i class="${r.tipo==='principal'?'p':'s'}"></i>Rua ${r.id} · ${r.pts.length-1} trecho(s)</div>`;
 document.getElementById('lP').innerHTML=P.map(li).join('');document.getElementById('lS').innerHTML=S.map(li).join('');
 document.querySelectorAll('.rua').forEach(d=>d.onclick=()=>{sel=+d.dataset.id;draw();renderPanel()})}
reset();renderPanel();
</script></body></html>
