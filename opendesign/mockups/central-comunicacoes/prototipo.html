<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protótipo — Central de Comunicações (Opção 1)</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0B1D2A;--z900:#10222f;--z800:#1c3140;--z700:#2a4353;--z600:#3d5a6b;--z500:#58616B;--z400:#7f8b93;--z300:#a8b2b8;--fg:#F5F2EB;--gold:#C9A46A;--gold2:#dfc08a;--red:#f08a80;--grn:#6fcf97;--blu:#7fb0e0;--amb:#fbbf24}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,'Segoe UI',sans-serif;font-size:14px;line-height:1.4}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:rgba(16,34,47,.6);border-right:1px solid var(--z800);padding:18px 12px;position:sticky;top:0;height:100vh}
aside .logo{font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-size:18px;padding:4px 10px 16px}
aside a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--z300);text-decoration:none;margin-bottom:2px}
aside a.on{background:var(--z800);color:#fff}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;height:64px;padding:0 32px;border-bottom:1px solid var(--z800);position:sticky;top:0;background:rgba(16,34,47,.92);backdrop-filter:blur(6px);z-index:20}
header .tt{color:var(--z400);font-size:13px}
.hr{display:flex;gap:12px;align-items:center;position:relative}
.bell{position:relative;background:var(--z900);border:1px solid var(--z800);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.bell .n{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:10px;font-size:11px;font-weight:600;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.av{width:30px;height:30px;border-radius:50%;background:var(--z800);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
#sino{position:absolute;right:0;top:46px;width:360px;max-width:calc(100vw - 24px);background:var(--z900);border:1px solid var(--z700);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.5);display:none;overflow:hidden}
#sino.on{display:block}
#sino .it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--z800);cursor:pointer;font-size:13px}
#sino .it:hover{background:var(--z800)}
#sino .ft{padding:10px 14px;color:var(--gold);font-size:13px;text-align:center;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
main{padding:32px;min-width:0}
h1{font-size:24px;line-height:32px;font-weight:700;margin:0;color:#fff}
.voltar{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--z400);text-decoration:none;background:none;border:0;padding:0}.voltar:hover{color:#fff}
.cab{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin:16px 0 8px}
.sts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sts span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--z800);background:var(--z900);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--z400)}.sts i{width:6px;height:6px;border-radius:50%;display:block}
.vc{font-size:12px;color:var(--z400);margin:0 0 12px}.vc u{color:var(--gold);cursor:pointer}
.ajuda{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--z800)}.ajuda label{display:block;font-size:12px;font-weight:600;color:var(--gold);margin-bottom:4px}.ajuda form{display:flex;gap:6px;max-width:560px}.ajuda input{flex:1;min-width:0;font-size:12px;padding:6px 8px;border-radius:4px}.ajuda button{font-size:12px;padding:6px 12px;border-radius:4px;background:#d97706;color:#fff;border:0}.ajuda button:disabled{opacity:.4}
.sub{color:var(--z400);font-size:14px;margin:4px 0 0}
.tabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--z800);margin:24px -4px 24px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:14px;line-height:20px;display:flex;gap:8px;align-items:center;color:var(--z400);white-space:nowrap;margin-bottom:-1px;transition:color .15s}.tabs button:hover{color:#fff}.
.tabs button.on{color:#fff;font-weight:500;border-bottom-color:#C9A46A}
.tabs button:disabled{opacity:.5;cursor:not-allowed}
.bd{border-radius:10px;font-size:11px;font-weight:600;padding:1px 7px;background:var(--z700);color:var(--z300)}
.bd.r{background:#dc2626;color:#fff}.bd.g{background:rgba(201,164,106,.2);color:var(--gold)}
.card{background:var(--z900);border:1px solid var(--z800);border-radius:12px;padding:20px;min-width:0}
.card h2{font-size:15px;margin:0 0 4px;font-weight:600}
.card .hint{color:var(--z400);font-size:12px;margin:0 0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stat{text-align:left;background:var(--z900);border:1px solid var(--z800);border-radius:12px;padding:14px}
.stat:hover{border-color:var(--gold)}
.stat .v{font-size:30px;font-weight:600;line-height:1.1;margin:6px 0 2px}
.stat .l{color:var(--z400);font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.two.eqc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.split.eq{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
label.l{display:block;font-size:12px;color:var(--z400);margin:12px 0 5px}
label.l:first-child{margin-top:0}
input[type=text],input[type=email],select{width:100%;background:var(--z800);border:1px solid var(--z700);color:#fff;border-radius:8px;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.seg{display:flex;background:var(--z800);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;background:none;border:0;border-radius:6px;padding:6px 8px;color:var(--z300);font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:var(--z600);color:#fff}
.chk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.chk:hover{background:var(--z800)}
.chk input{accent-color:#C9A46A;margin-right:8px}
.chk span.t{display:flex;align-items:center;flex:1}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.gh h3{margin:0;font-size:14px;font-weight:600}
.gh .ic{width:28px;height:28px;border-radius:8px;background:rgba(251,191,36,.12);color:var(--amb);display:flex;align-items:center;justify-content:center}
.grp{margin-bottom:18px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--z800);flex-wrap:wrap}
.row .m{display:flex;gap:10px;align-items:center;flex:1;min-width:220px}
.row .nm{font-weight:500}
.row .meta{color:var(--z400);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--z800);border:1px solid var(--z700);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:rgba(201,164,106,.14);border-color:rgba(201,164,106,.5);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--z700)}
.btn.solid{background:var(--gold);color:#241a08;border-color:var(--gold);font-weight:600}
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:500;margin:0 4px 2px 0;background:var(--z800);color:var(--z300)}
.chip.r{background:rgba(220,38,38,.18);color:var(--red)}.chip.g{background:rgba(34,197,94,.15);color:var(--grn)}.chip.b{background:rgba(59,130,246,.18);color:var(--blu)}.chip.a{background:rgba(251,191,36,.15);color:var(--amb)}.chip.c{background:rgba(8,145,178,.2);color:#22d3ee}
.empty{color:var(--z400);padding:18px 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--z700);border:1px solid var(--gold);border-radius:10px;padding:10px 16px;display:none;z-index:50;max-width:calc(100vw - 24px)}
.toast.on{display:flex;gap:8px;align-items:center}
.panel{display:none}.panel.on{display:block}
.proto{background:rgba(201,164,106,.1);border:1px solid rgba(201,164,106,.4);color:var(--gold2);border-radius:8px;padding:6px 12px;font-size:12px;margin-bottom:14px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.two.eqc,.split,.split.eq{grid-template-columns:1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}header{padding:0 16px}main{padding:24px 16px}}
@media(max-width:480px){.grid4{grid-template-columns:1fr 1fr;gap:10px}.stat .v{font-size:24px}h1{font-size:20px}.row .acts .btn{flex:1;justify-content:center}}
</style></head><body>
<div class="app">
<aside><div class="logo">Legado Digital</div>
 <a href="#"><span data-i="layout"></span>Dashboard</a><a href="#"><span data-i="users"></span>Parceiros</a><a href="#"><span data-i="clip"></span>Memoriais</a><a href="#" class="on"><span data-i="mail"></span>Comunicações</a><a href="#"><span data-i="users"></span>Usuários</a></aside>
<div style="min-width:0">
<header><span class="tt">Central &rsaquo; Comunicações &nbsp;·&nbsp; <b style="color:var(--gold)">protótipo, dados fictícios</b></span>
 <div class="hr"><button class="bell" id="bell" aria-label="Alertas"><span data-i="bell"></span><span class="n" id="bn">0</span></button><div id="sino"></div><span class="av">RR</span></div></header>
<main>
<a class="voltar" href="#"><span data-i="back"></span>Voltar pro Dashboard</a>
<div class="cab"><div><h1>Central de Comunicações</h1><p class="sub">O que exige uma ação sua hoje: dado faltando, e-mails que falharam, leads esperando resposta e o contato com parceiros e famílias.</p></div>
<div class="acts"><button class="btn" id="bpar">Ir para Parceiros</button><button class="btn" style="background:#2563eb;border-color:#2563eb;color:#fff" id="bmem">Ver Memoriais</button></div></div>
<div class="sts" id="sts"></div>
<div class="tabs" id="tabs"></div>
<div class="vc" id="vc"></div>
<div class="ajuda"><label for="aj">LegadoBot — ajuda</label><form id="ajf"><input type="text" id="aj" placeholder="Pergunte aqui. Ex.: como reenvio a senha da família?" autocomplete="off"><button type="submit" id="ajb" disabled>Perguntar</button></form></div>
<div id="view"></div>
</main></div></div>
<div class="toast" id="toast"></div>
<script>
const P={
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
 mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
 alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 clip:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
 layout:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
 grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
 key:'<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
 send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
 refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
 msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
 back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
 user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

// ---------- dados fictícios ----------
const TIPOS=['contato da família','data de falecimento','foto','história'];
const pend=[
 {id:1,n:'Maria Lígia da Cunha Machado',par:'Funerária Vale da Paz',falta:['foto','história'],quem:'familia',orig:'parceiro',dias:0,mail:'ligia.machado@gmail.com',obs:'senha enviada hoje'},
 {id:2,n:'Odelmo Leão',par:'—',falta:['foto','história'],quem:'equipe',orig:'central',dias:3,ilustre:1,mail:null},
 {id:3,n:'Virgílio Galassi',par:'—',falta:['data de falecimento','contato da família'],quem:'equipe',orig:'central',dias:6,mail:null,ilustre:1},
 {id:4,n:'Carlos Saraiva',par:'—',falta:['foto'],quem:'familia',orig:'cemitério',dias:31,mail:'pedro.saraiva@estouonline.com.br'},
 {id:5,n:'Antônio Ferreira Lima',par:'Funerária Vale da Paz',falta:['história'],quem:'familia',orig:'parceiro',dias:9,mail:'familia.lima@gmail.com'},
 {id:6,n:'José Pereira Rocha',par:'Funerária Aurora',falta:['contato da família','data de falecimento','história'],quem:'familia',orig:'cemitério',dias:21,mail:null}
];
const emails=[
 {id:1,t:'Envio ao fornecedor',d:'placas@graviart.com.br',m:'Carlos Saraiva',s:'erro',e:'Caixa de destino cheia (SMTP 552)',q:'hoje, 09:14'},
 {id:2,t:'Senha da família',d:'ligia.machado@gmail.com',m:'Maria Lígia da Cunha Machado',s:'enviado',q:'hoje, 08:40'},
 {id:3,t:'Confirmação de placa',d:'familia.lima@gmail.com',m:'Antônio Ferreira Lima',s:'confirmado',q:'ontem, 17:02'},
 {id:4,t:'Convite de acesso (parceiro)',d:'contato@valedapaz.com.br',m:'Funerária Vale da Paz',s:'enviado',q:'ontem, 11:30'},
 {id:5,t:'Senha da família',d:'lucia.rocha@hotmail.com',m:'José Pereira Rocha',s:'erro',e:'Endereço de e-mail não existe (SMTP 550)',q:'21/10, 15:50'},
 {id:6,t:'Código de acesso (visitante)',d:'visita@exemplo.com',m:'Carlos Saraiva',s:'enviado',q:'20/10, 20:11'}
];
const leads=[
 {id:1,t:'parceiro',n:'Marcos Aurora',emp:'Funerária Aurora',c:'Uberlândia',st:'novo',msg:'Quero oferecer o memorial aos nossos clientes.',q:'hoje, 07:55',tel:'(34) 99888-0001'},
 {id:2,t:'parceiro',n:'Ana Paula Tupa',emp:'Prefeitura de Tupaciguara',c:'Tupaciguara',st:'em contato',msg:'Dúvida sobre o mapa do cemitério José Lázaro.',q:'20/10',tel:'(34) 99700-5544'},
 {id:3,t:'familia',n:'Lúcia Rocha',emp:'',c:'Uberlândia',st:'novo',msg:'Homenageado: José Pereira Rocha. Como funciona a placa?',q:'ontem',tel:'(34) 99120-7788'}
];
const parc=[
 {n:'Funerária Vale da Paz',mail:'contato@valedapaz.com.br',tel:'(34) 99111-2233',at:'ativo hoje',mem:[['Maria Lígia da Cunha Machado','ligia.machado@gmail.com'],['Antônio Ferreira Lima','familia.lima@gmail.com']]},
 {n:'Funerária Aurora',mail:'contato@aurora.com.br',tel:'(34) 99888-0001',at:'nunca acessou',mem:[['José Pereira Rocha','sem e-mail']]}
];
let st={tab:'vg',agr:'tipo',faltas:new Set(TIPOS),quem:'todos',par:'todos',q:'',ef:'todos',eq:'',openPar:0};
let seen=false;

// ---------- helpers ----------
const nErr=()=>emails.filter(e=>e.s==='erro').length;
const nLead=()=>leads.filter(l=>l.st==='novo').length;
const chipS=s=>`<span class="chip ${{erro:'r',enviado:'b',confirmado:'g',novo:'a','em contato':'b'}[s]||''}">${s}</span>`;
const ini=n=>n.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('');
const toast=t=>{const e=$('#toast');e.innerHTML=ic('check')+t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2800)};
const hoje=()=>'agora';
function filtradas(){return pend.filter(m=>m.falta.some(f=>st.faltas.has(f))&&(st.quem==='todos'||m.quem===st.quem)&&(st.par==='todos'||m.par===st.par)&&m.n.toLowerCase().includes(st.q.toLowerCase()))}

// ---------- ações ----------
function reenviarAcesso(id){const m=pend.find(x=>x.id===id);if(!m.mail){toast('Cadastre o e-mail da família na ficha antes de reenviar.');return}
 emails.unshift({id:Date.now(),t:'Senha da família',d:m.mail,m:m.n,s:'enviado',q:hoje()});toast(`Senha nova enviada para ${m.mail}.`);render()}
function lembrar(id){const m=pend.find(x=>x.id===id);
 emails.unshift({id:Date.now(),t:'Lembrete de dados faltando',d:m.mail,m:m.n,s:'enviado',q:hoje()});toast(`Lembrete enviado para ${m.mail}.`);render()}
function reenviarErro(id){const e=emails.find(x=>x.id===id);e.s='enviado';delete e.e;e.q=hoje();toast(`Reenviado para ${e.d}.`);render()}
function go(t){st.tab=t;render();window.scrollTo({top:0})}

// ---------- abas ----------
function tabsBar(){
 const T=[['vg','layout','Visão geral',nErr()+nLead(),'r'],['pe','clip','Pendências dos memoriais',pend.length,'g'],['em','mail','E-mails enviados',nErr(),'r'],['ct','users','Contatos e leads',nLead(),'g'],['fo','box','Fornecedor de placas',0,''],['cx','inbox','Caixa contato@ (em breve)',0,'']];
 $('#tabs').innerHTML=T.map(([id,i,t,n,k])=>`<button data-t="${id}" class="${st.tab===id?'on':''}" ${id==='cx'?'disabled title="Depende da integração com o Google"':''}>${t}${n?`<span class="bd ${k}">${n}</span>`:''}</button>`).join('');
 $$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
}

// ---------- visões ----------
function vVisao(){
 const fila=[
  ...emails.filter(e=>e.s==='erro').map(e=>`<div class="row"><div class="m"><span class="av" style="color:var(--red)">${ic('alert')}</span><div><div class="nm">${e.t} · ${e.m}</div><div class="meta">${e.e}</div></div></div><div class="acts"><button class="btn pri" data-re="${e.id}">${ic('refresh')}Reenviar</button></div></div>`),
  ...leads.filter(l=>l.st==='novo').map(l=>`<div class="row"><div class="m"><span class="av">${ic('user')}</span><div><div class="nm">${l.n}${l.emp?' · '+l.emp:''}</div><div class="meta">${l.msg}</div></div></div><div class="acts"><button class="btn pri" data-go="ct">${ic('arrow')}Responder</button></div></div>`),
  ...pend.filter(m=>m.dias>=14).map(m=>`<div class="row"><div class="m"><span class="av">${ic('clip')}</span><div><div class="nm">${m.n}</div><div class="meta">sem ${m.falta.join(', ')} há ${m.dias} dias</div></div></div><div class="acts"><button class="btn pri" data-go="pe">${ic('arrow')}Ver pendência</button></div></div>`)
 ].join('');
 return `<div class="grid4">
  <button class="stat" data-go="em"><span style="color:var(--red)">${ic('alert')}</span><div class="v">${nErr()}</div><div class="l">e-mails com erro</div></button>
  <button class="stat" data-go="pe"><span style="color:var(--amb)">${ic('clip')}</span><div class="v">${pend.length}</div><div class="l">memoriais com dado faltando</div></button>
  <button class="stat" data-go="ct"><span style="color:var(--gold)">${ic('user')}</span><div class="v">${nLead()}</div><div class="l">leads novos</div></button>
  <button class="stat" data-go="em"><span style="color:var(--blu)">${ic('mail')}</span><div class="v">${emails.length}</div><div class="l">e-mails nos últimos 30 dias</div></button></div>
 <div class="two"><div class="card"><h2>Fila de hoje</h2><p class="hint">Do mais urgente para o menos: erro, lead novo, pendência antiga.</p>${fila||'<div class="empty">Nada urgente. Tudo em dia.</div>'}</div>
 <div class="card"><h2>Atividade recente</h2><p class="hint">Últimos e-mails automáticos.</p>${emails.slice(0,5).map(e=>`<div class="row"><div class="m" style="min-width:0"><div><div class="nm" style="font-size:13px">${e.t}</div><div class="meta">${e.m} · ${e.q}</div></div></div>${chipS(e.s)}</div>`).join('')}</div></div>`;
}

function vPend(){
 const L=filtradas();
 const cnt=t=>pend.filter(m=>m.falta.includes(t)).length;
 const pars=['todos',...new Set(pend.map(m=>m.par).filter(p=>p!=='—')),'—'];
 const painel=`<div class="card"><h2>Filtros</h2><p class="hint">Mostre só o que quer cobrar agora.</p>
  <label class="l">Mostrar por</label><div class="seg"><button data-agr="tipo" class="${st.agr==='tipo'?'on':''}">${ic('grid')}Dado faltante</button><button data-agr="mem" class="${st.agr==='mem'?'on':''}">${ic('list')}Memorial</button></div>
  <label class="l">Dado que falta</label>${TIPOS.map(t=>`<label class="chk"><span class="t"><input type="checkbox" data-f="${t}" ${st.faltas.has(t)?'checked':''}>${t[0].toUpperCase()+t.slice(1)}</span><span class="bd">${cnt(t)}</span></label>`).join('')}
  <label class="l" for="fq">Quem preenche</label><select id="fq"><option value="todos">Todos</option><option value="familia" ${st.quem==='familia'?'selected':''}>Aguardando a família</option><option value="equipe" ${st.quem==='equipe'?'selected':''}>Equipe</option></select>
  <label class="l" for="fp">Parceiro</label><select id="fp">${pars.map(p=>`<option value="${p}" ${st.par===p?'selected':''}>${p==='todos'?'Todos':p==='—'?'Sem parceiro (Central)':p}</option>`).join('')}</select>
  <label class="l" for="fb">Buscar memorial</label><input type="text" id="fb" placeholder="Nome do homenageado" value="${st.q}"></div>`;
 const linha=(m,mostrarFalta)=>`<div class="row"><div class="m"><span class="av">${ini(m.n)}</span><div style="min-width:0"><div class="nm">${m.n}${m.ilustre?' <span class="chip c">Ilustre</span>':''}</div>
   <div class="meta">${m.par} · cadastrado via ${m.orig} · ${m.dias===0?'hoje':'há '+m.dias+' dias'}${m.obs?' · '+m.obs:''}</div>
   ${mostrarFalta?`<div style="margin-top:3px">${m.falta.map(f=>`<span class="chip a">sem ${f}</span>`).join('')}${m.quem==='familia'?'<span class="chip b">aguardando a família</span>':''}</div>`:''}</div></div>
  <div class="acts"><button class="btn pri" data-fi="${m.id}">${ic('edit')}Abrir ficha</button><button class="btn" data-ra="${m.id}" ${m.mail?'':'disabled title="Sem e-mail da família cadastrado"'}>${ic('key')}Reenviar acesso</button><button class="btn" data-lf="${m.id}" ${m.mail&&m.quem==='familia'?'':'disabled title="'+(m.mail?'Preenchido pela equipe':'Sem e-mail da família cadastrado')+'"'}>${ic('send')}Lembrar família</button></div></div>`;
 let corpo;
 if(!L.length)corpo='<div class="card"><div class="empty">Nenhum memorial com esses filtros.</div></div>';
 else if(st.agr==='tipo')corpo=TIPOS.filter(t=>st.faltas.has(t)).map(t=>{const x=L.filter(m=>m.falta.includes(t));if(!x.length)return'';return `<div class="card grp"><div class="gh"><span class="ic">${ic('clip')}</span><h3>Sem ${t}</h3><span class="bd g">${x.length}</span></div>${x.map(m=>linha(m,false)).join('')}</div>`}).join('');
 else corpo=`<div class="card">${L.map(m=>linha(m,true)).join('')}</div>`;
 return `<div class="split"><div class="stack">${painel}</div><div class="stack">${corpo}</div></div>`;
}

function vEmails(){
 const L=emails.filter(e=>(st.ef==='todos'||e.s===st.ef)&&(e.d+e.m+e.t).toLowerCase().includes(st.eq.toLowerCase()));
 const ult=emails[0];
 return `<div class="card"><div class="row" style="border:0;padding:0 0 12px"><div class="seg" style="min-width:300px;flex:1;max-width:420px">${['todos','erro','enviado','confirmado'].map(f=>`<button data-ef="${f}" class="${st.ef===f?'on':''}">${f[0].toUpperCase()+f.slice(1)}${f==='erro'?' ('+nErr()+')':''}</button>`).join('')}</div>
  <div style="flex:1;min-width:220px;max-width:360px"><input type="text" id="eb" placeholder="Buscar por e-mail, memorial ou tipo" value="${st.eq}"></div></div>
  ${L.map(e=>`<div class="row"><div class="m"><span class="av" style="color:${e.s==='erro'?'var(--red)':'var(--gold)'}">${ic(e.s==='erro'?'alert':'mail')}</span><div style="min-width:0"><div class="nm">${e.t} ${chipS(e.s)}</div><div class="meta">${e.m} · para ${e.d} · ${e.q}</div>${e.e?`<div class="meta" style="color:var(--red)">${e.e}</div>`:''}</div></div>${e.s==='erro'?`<div class="acts"><button class="btn pri" data-re="${e.id}">${ic('refresh')}Reenviar</button><button class="btn" data-fi="0">${ic('edit')}Abrir ficha</button></div>`:''}</div>`).join('')||'<div class="empty">Nenhum e-mail com esse filtro.</div>'}</div>`;
}

function vContatos(){
 const lc=l=>`<div class="row"><div class="m"><span class="av">${ini(l.n)}</span><div><div class="nm">${l.n}${l.emp?' · '+l.emp:''} ${chipS(l.st)}</div><div class="meta">${l.msg}</div><div class="meta">${l.c} · ${l.q}</div></div></div><div class="acts"><button class="btn pri" data-wa="${l.id}">${ic('msg')}WhatsApp</button><button class="btn" data-mt="${l.id}">${ic('mail')}E-mail</button><select data-ls="${l.id}" style="width:auto"><option ${l.st==='novo'?'selected':''}>novo</option><option ${l.st==='em contato'?'selected':''}>em contato</option><option>convertido</option><option>descartado</option></select></div></div>`;
 return `<div class="two eqc">
  <div class="stack"><div class="card"><h2>Leads de parceiro</h2><p class="hint">Quem pediu contato pelo site para oferecer o Legado.</p>${leads.filter(l=>l.t==='parceiro').map(lc).join('')}</div>
  <div class="card"><h2>Leads de família</h2><p class="hint">Famílias que pediram informação.</p>${leads.filter(l=>l.t==='familia').map(lc).join('')}</div></div>
  <div class="card"><h2>Parceiros e contatos das famílias</h2><p class="hint">Contato de cada parceiro e o contato oficial da família em cada memorial dele.</p>
  ${parc.map((p,i)=>`<div style="border-top:1px solid var(--z800)"><button class="row" data-pp="${i}" style="width:100%;background:none;border:0;text-align:left;color:inherit"><div><div class="nm">${p.n} <span class="meta">· ${p.at}</span></div><div class="meta">${p.mail} · ${p.tel}</div></div><span class="meta">${p.mem.length} memoriais</span></button>${st.openPar===i?p.mem.map(([n,m])=>`<div class="row" style="padding-left:14px"><div class="m"><div><div class="nm" style="font-size:13px">${n}</div><div class="meta">${m}</div></div></div><div class="acts"><button class="btn" data-wa="0">${ic('msg')}WhatsApp</button></div></div>`).join(''):''}</div>`).join('')}</div></div>`;
}

function vForn(){
 return `<div class="split eq"><div class="card"><h2>E-mail do fornecedor de placas</h2><p class="hint">Todo QR Code gerado é encaminhado a este endereço com o nome do homenageado, o link da página e o PNG anexado.</p>
  <label class="l" for="fe">E-mail do fornecedor</label><input type="email" id="fe" value="placas@graviart.com.br"><div style="margin-top:12px"><button class="btn solid" id="fs">Salvar</button></div></div>
  <div class="card"><h2>Envios ao fornecedor</h2><p class="hint">O último envio com erro pode ser reenviado daqui.</p>
  ${[['Carlos Saraiva','erro','hoje, 09:14','Caixa de destino cheia (SMTP 552)'],['Antônio Ferreira Lima','confirmado','ontem, 17:02',''],['Helena Martins Costa','enviado','20/10, 10:20','']].map(([n,s,q,e],i)=>`<div class="row"><div class="m"><div><div class="nm">${n} ${chipS(s)}</div><div class="meta">${q}</div>${e?`<div class="meta" style="color:var(--red)">${e}</div>`:''}</div></div>${s==='erro'?`<div class="acts"><button class="btn pri" data-re="1">${ic('refresh')}Reenviar</button></div>`:''}</div>`).join('')}</div></div>`;
}

// ---------- sino ----------
function sino(){
 const itens=[...emails.filter(e=>e.s==='erro').map(e=>['var(--red)',`${e.t} falhou — ${e.m}`,e.e,'em']),...leads.filter(l=>l.st==='novo').map(l=>['var(--amb)',`Lead novo: ${l.n}`,l.msg,'ct']),...(seen?[]:emails.filter(e=>e.s==='enviado').slice(0,1).map(e=>['var(--grn)',`${e.t} enviado — ${e.m}`,e.q,'em']))];
 $('#bn').textContent=itens.length;$('#bn').style.display=itens.length?'flex':'none';
 $('#sino').innerHTML=itens.map(([c,t,s,g])=>`<div class="it" data-go="${g}"><span class="dot" style="background:${c}"></span><div><div>${t}</div><div class="meta" style="color:var(--z400);font-size:12px">${s}</div></div></div>`).join('')+`<div class="ft" data-go="vg">Abrir Central de Comunicações</div>`;
}

// ---------- render ----------
function render(){
 tabsBar();sino();
 const NM={vg:'Visão geral',pe:'Pendências dos memoriais',em:'E-mails enviados',ct:'Contatos e leads',fo:'Fornecedor de placas'};
 $('#vc').innerHTML=`Você está em: <u data-go="vg">Comunicações</u>${st.tab==='vg'?'':' › '+NM[st.tab]}`;
 $('#sts').innerHTML=[['E-mails: '+(nErr()?nErr()+' com erro':'sem erro'),nErr()?'#ef4444':'#22c55e'],['Leads novos: '+nLead(),nLead()?'#eab308':'#22c55e'],['Memoriais com dado faltando: '+pend.length,'#eab308'],['Fornecedor: último envio com erro','#ef4444'],['Caixa contato@: não conectada','#3d5a6b']].map(([t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join('');
 const aj=$('#aj');aj.oninput=()=>{$('#ajb').disabled=!aj.value.trim()};$('#ajf').onsubmit=e=>{e.preventDefault();toast(`Abre o LegadoBot com a pergunta e a aba "${NM[st.tab]}" como contexto.`);aj.value='';aj.oninput()};
 $('#view').innerHTML={vg:vVisao,pe:vPend,em:vEmails,ct:vContatos,fo:vForn}[st.tab]();
 $$('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
 $$('[data-go]').forEach(b=>b.onclick=()=>{$('#sino').classList.remove('on');go(b.dataset.go)});
 $$('[data-re]').forEach(b=>b.onclick=()=>reenviarErro(+b.dataset.re));
 $$('[data-ra]').forEach(b=>b.onclick=()=>reenviarAcesso(+b.dataset.ra));
 $$('[data-lf]').forEach(b=>b.onclick=()=>lembrar(+b.dataset.lf));
 $$('[data-fi]').forEach(b=>b.onclick=()=>toast('Abre a ficha do memorial na aba certa.'));
 $$('[data-wa]').forEach(b=>b.onclick=()=>toast('Abre o WhatsApp na conversa.'));
 $$('[data-mt]').forEach(b=>b.onclick=()=>toast('Abre o e-mail para o lead.'));
 $$('[data-agr]').forEach(b=>b.onclick=()=>{st.agr=b.dataset.agr;render()});
 $$('[data-f]').forEach(b=>b.onchange=()=>{b.checked?st.faltas.add(b.dataset.f):st.faltas.delete(b.dataset.f);render()});
 $$('[data-ef]').forEach(b=>b.onclick=()=>{st.ef=b.dataset.ef;render()});
 $$('[data-pp]').forEach(b=>b.onclick=()=>{st.openPar=st.openPar===+b.dataset.pp?-1:+b.dataset.pp;render()});
 $$('[data-ls]').forEach(s=>s.onchange=()=>{leads.find(l=>l.id==s.dataset.ls).st=s.value;render()});
 const q=$('#fq');if(q)q.onchange=()=>{st.quem=q.value;render()};
 const p=$('#fp');if(p)p.onchange=()=>{st.par=p.value;render()};
 const b=$('#fb');if(b)b.oninput=()=>{st.q=b.value;const pos=b.selectionStart;render();const n=$('#fb');n.focus();n.setSelectionRange(pos,pos)};
 const eb=$('#eb');if(eb)eb.oninput=()=>{st.eq=eb.value;const pos=eb.selectionStart;render();const n=$('#eb');n.focus();n.setSelectionRange(pos,pos)};
 const fs=$('#fs');if(fs)fs.onclick=()=>toast('Salvo. Próximos QR Codes vão para este e-mail.');
}
$('#bell').onclick=e=>{e.stopPropagation();$('#sino').classList.toggle('on');seen=true;setTimeout(()=>{sino()},0)};
document.addEventListener('click',e=>{if(!e.target.closest('#sino'))$('#sino').classList.remove('on')});
render();
</script></body></html>
